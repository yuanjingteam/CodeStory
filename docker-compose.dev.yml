services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    container_name: codestory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-codestory}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - codestory-dev-network

  redis:
    image: redis:7-alpine
    container_name: codestory-redis-dev
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - codestory-dev-network

volumes:
  postgres_data:
    name: codestory_dev_postgres_data
  redis_dev_data:
    name: codestory_dev_redis_data

networks:
  codestory-dev-network:
    driver: bridge
