services:
  redis:
    image: redis:7-alpine
    container_name: codestory-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - codestory-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codestory-backend
    expose:
      - '4001'
    dns:
      - 223.5.5.5
      - 8.8.8.8
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      OSS_REGION: ${OSS_REGION}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_DOMAIN: ${OSS_DOMAIN}
    depends_on:
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - codestory-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_UPLOAD_PROXY_URL: ${NEXT_PUBLIC_UPLOAD_PROXY_URL}
    container_name: codestory-frontend
    expose:
      - '3001'
    dns:
      - 223.5.5.5
      - 8.8.8.8
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_UPLOAD_PROXY_URL: ${NEXT_PUBLIC_UPLOAD_PROXY_URL}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - codestory-network

  nginx:
    image: nginx:1.27-alpine
    container_name: codestory-nginx
    ports:
      - '18080:80'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/uploads:/app/uploads:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - codestory-network

volumes:
  redis_data:

networks:
  codestory-network:
    driver: bridge
