# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codepractice-postgres
    environment:
      POSTGRES_DB: codepractice
      POSTGRES_USER: codepractice
      POSTGRES_PASSWORD: codepractice_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codepractice-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://codepractice:codepractice_password@postgres:5432/codepractice
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data: