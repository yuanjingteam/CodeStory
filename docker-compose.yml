services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    container_name: codestory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-init-app-user.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - codestory-data-network

  redis:
    image: redis:7-alpine
    container_name: codestory-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - codestory-data-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codestory-backend
    ports:
      - '127.0.0.1:4001:4001'
    dns:
      - 223.5.5.5
      - 8.8.8.8
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 4001
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
      AI_EMBEDDING_BATCH_SIZE: ${AI_EMBEDDING_BATCH_SIZE}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTENT_RETENTION_DAYS: ${CONTENT_RETENTION_DAYS:-30}
      CONTENT_PURGE_ENABLED: ${CONTENT_PURGE_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OSS_REGION: ${OSS_REGION}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - codestory-edge-network
      - codestory-data-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_UPLOAD_PROXY_URL: ${NEXT_PUBLIC_UPLOAD_PROXY_URL}
    container_name: codestory-frontend
    ports:
      - '127.0.0.1:3001:3001'
    dns:
      - 223.5.5.5
      - 8.8.8.8
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_UPLOAD_PROXY_URL: ${NEXT_PUBLIC_UPLOAD_PROXY_URL}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - codestory-edge-network

volumes:
  postgres_data:
    external: true
    name: codestory_postgres_data
  redis_data:

networks:
  codestory-edge-network:
    driver: bridge
  codestory-data-network:
    driver: bridge
    internal: true
