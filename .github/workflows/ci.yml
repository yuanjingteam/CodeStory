name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:devpass@localhost:55432/codestory
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      AI_RAG_ENABLED: "false"
      AI_GRAPH_ENABLED: "false"
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: codestory
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codestory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm prisma generate
      - name: Run backend checks
        working-directory: backend
        run: pnpm run check
      - name: Check operations scripts
        working-directory: backend
        run: |
          pnpm exec tsc -p scripts/tsconfig.json
          pnpm exec vitest run --config scripts/vitest.config.ts

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4001
      NEXT_PUBLIC_UPLOAD_PROXY_URL: http://localhost:4001/uploads
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend checks
        working-directory: frontend
        run: pnpm run check
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  browser:
    name: Browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chrome for Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chrome
      - name: Run stage 2 browser regression
        working-directory: frontend
        run: pnpm run test:e2e:stage2
      - name: Run stage 5 browser regression
        working-directory: frontend
        run: pnpm run test:e2e:stage5
      - name: Upload browser artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Production image build
    needs: [backend, frontend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.yml config --quiet
      - name: Build production images
        run: docker compose --env-file .env.production.example -f docker-compose.yml build backend frontend
